
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b00020">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-512.png">
<title>AP13 NEWS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2;color:#222}
header{background:#b00020;color:white;text-align:center;padding:18px 10px}
header img{width:90px;height:90px;object-fit:contain;border-radius:18px}
header h1{margin:8px 0;font-size:30px}
header p{margin:5px}
nav{background:#222;color:white;padding:13px;text-align:center}
main{max-width:850px;margin:auto;padding:12px}
h2{color:#b00020}
.news{background:white;padding:14px;margin:14px 0;border-radius:10px;box-shadow:0 2px 6px #ccc}
.news img{width:100%;max-height:260px;object-fit:cover;border-radius:7px}
.news a{color:#b00020;text-decoration:none;font-weight:bold;font-size:19px}
.date{color:#777;font-size:13px}
footer{background:#222;color:white;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<img src="./icon-512.png" alt="AP13 NEWS Logo">
<h1>AP13 NEWS</h1>
<p>నిజం జనం ముందుకు....</p>
</header>
<nav>ఆంధ్రప్రదేశ్ | తెలంగాణ | జాతీయం | ప్రపంచం</nav>
<main>
<h2>తాజా వార్తలు</h2>
<div id="news">వార్తలు లోడ్ అవుతున్నాయి...</div>
</main>
<footer>© AP13 NEWS<br>నిజం జనం ముందుకు....</footer>
<script>
function showNews(data){
const posts=data.feed.entry||[];
const box=document.getElementById("news");
box.innerHTML="";
if(!posts.length){box.textContent="ప్రస్తుతం వార్తలు లేవు.";return;}
posts.forEach(post=>{
const title=post.title.$t;
const link=post.link.find(x=>x.rel==="alternate").href;
const date=new Date(post.published.$t).toLocaleDateString("te-IN");
const content=post.content?post.content.$t:"";
const match=content.match(/<img[^>]+src=["']([^"']+)["']/i);
const item=document.createElement("div");
item.className="news";
if(match){
const img=document.createElement("img");
img.src=match[1];img.alt=title;item.appendChild(img);
}
const heading=document.createElement("a");
heading.href=link;heading.target="_blank";heading.rel="noopener";
heading.textContent=title;
const time=document.createElement("p");
time.className="date";time.textContent="తేదీ: "+date;
item.append(heading,time);box.appendChild(item);
});
}
</script>
<script src="https://wwwap13news.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=25&callback=showNews"></script>
<script>
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js");
});
}
</script>
</body>
</html>
